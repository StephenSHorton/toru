<!DOCTYPE html>
<html lang="en" class="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Toru — Shared board demo</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0b0d; color: #e7e7ea; font: 13px/1.4 "Inter", ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
      main { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; height: 100%; padding: 10px; box-sizing: border-box; }
      section { display: flex; flex-direction: column; min-height: 0; border: 1px solid #2a2a30; }
      header { display: flex; justify-content: space-between; padding: 6px 10px; border-bottom: 1px solid #2a2a30; background: #141418; }
      header b { font-weight: 600; }
      header span { color: #9a9aa3; }
      .frame { flex: 1; position: relative; overflow: hidden; }
      /* Each Toru's window at 1.5× its box, shrunk to fit, so its whole toolbar shows. */
      iframe { position: absolute; top: 0; left: 0; border: 0; width: 150%; height: 150%; transform: scale(0.6667); transform-origin: 0 0; }
    </style>
  </head>
  <body>
    <!-- Vite only (not built), in `vite --mode share-demo`: two Torus, each
         with its own board store and agent, sharing one board through the
         real room (board_share_demo_test.go). Left is Stephen's Toru, which
         owns the board; right is Blake's, which joined it. -->
    <main>
      <section>
        <header><b>Stephen's Toru</b><span>owns the board, shares it in the room</span></header>
        <div class="frame"><iframe title="Stephen's Toru" src="/?view=whiteboard&id=brd-demo&link=http"></iframe></div>
      </section>
      <section>
        <header><b>Blake's Toru</b><span>joined it by room code: a live copy</span></header>
        <div class="frame"><iframe title="Blake's Toru" src="/?view=whiteboard&id=brd-demo&link=http&base=/__board/live-b"></iframe></div>
      </section>
    </main>
  </body>
</html>
