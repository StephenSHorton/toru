name: Release

# Cut a release by pushing a semver tag:  git tag v0.1.0 && git push origin v0.1.0
# (or run manually via the Actions tab with a tag input).
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write # create the GitHub Release + upload assets

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install wails3 CLI + NSIS
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.98
          "$(go env GOPATH)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          choco install nsis -y --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          $version = $tag -replace '^v', ''
          "tag=$tag"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Releasing $tag (version $version)"

      - name: Stamp version into the Win32 resource (info.json)
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $p = "build/windows/info.json"
          $j = Get-Content $p -Raw | ConvertFrom-Json
          $j.fixed.file_version = $v
          $j.info.'0000'.ProductVersion = $v
          $j | ConvertTo-Json -Depth 10 | Set-Content $p
          Get-Content $p

      - name: Build binary (frontend + Go, version-injected)
        # Injects -X main.version=<version> via the VERSION var (see build/windows/Taskfile.yml).
        run: wails3 task windows:build PACKAGE_MANAGER=bun VERSION=${{ steps.ver.outputs.version }}

      # LAN (docs/lan.md): toru-lan.exe is both the one-time elevated installer
      # ("toru-lan.exe install", run by Toru with UAC) and the ToruLan service.
      # The UAC prompt shows its version resource, so it gets one from
      # info.json with its own description, unless cmd/toru-lan ships a .syso.
      - name: Build toru-lan.exe (LAN installer + service)
        shell: pwsh
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $syso = $null
          if (-not (Get-ChildItem cmd/toru-lan -Filter *.syso -ErrorAction SilentlyContinue)) {
            $info = Get-Content build/windows/info.json -Raw | ConvertFrom-Json
            $info.info.'0000'.FileDescription = "Toru LAN"
            $info.info.'0000'.ProductName = "Toru LAN"
            $lanInfo = Join-Path $env:RUNNER_TEMP "toru-lan-info.json"
            $info | ConvertTo-Json -Depth 10 | Set-Content -Encoding utf8 $lanInfo
            $syso = "cmd/toru-lan/rsrc_windows_amd64.syso"
            wails3 generate syso -arch amd64 -icon build/windows/icon.ico -manifest build/windows/wails.exe.manifest -info $lanInfo -out $syso
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          go build -trimpath -ldflags "-s -w -X main.version=$v" -o bin/toru-lan.exe ./cmd/toru-lan
          $code = $LASTEXITCODE
          if ($syso) { Remove-Item $syso }
          exit $code

      # install refuses any wintun.dll but the vendored one (api.WintunSHA256);
      # catch a mismatch here instead of on a user's PC.
      - name: Check wintun.dll against the pinned hash
        shell: pwsh
        run: |
          $want = (Select-String -Path internal/lan/api/api.go -Pattern 'WintunSHA256\s*=\s*"([0-9a-f]{64})"').Matches[0].Groups[1].Value
          $got = (Get-FileHash -Algorithm SHA256 build/windows/wintun/wintun.dll).Hash.ToLower()
          if ($got -ne $want) { throw "wintun.dll is $got, api.WintunSHA256 says $want" }
          Write-Host "wintun.dll $got"

      - name: Build NSIS installer (per-user, no UAC)
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $root = (Get-Location).Path
          wails3 generate webview2bootstrapper -dir build/windows/nsis
          # Quote each -D arg: PowerShell otherwise splits "...=0.1.0" at the dots.
          makensis "-DINFO_PRODUCTVERSION=$v" "-DWAILS_INSTALL_SCOPE=user" "-DREQUEST_EXECUTION_LEVEL=user" "-DARG_WAILS_AMD64_BINARY=$root\bin\toru.exe" "-DARG_TORU_LAN_BINARY=$root\bin\toru-lan.exe" "-DARG_WINTUN_DLL=$root\build\windows\wintun\wintun.dll" "-DARG_WINTUN_LICENSE=$root\build\windows\wintun\LICENSE.txt" "-DARG_THIRD_PARTY_NOTICES=$root\THIRD_PARTY_NOTICES" build/windows/nsis/project.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Assemble release assets (installer + portable zip + SHA256SUMS)
        id: assets
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $installer = "toru-$v-windows-amd64-installer.exe"
          $zip       = "toru-$v-windows-amd64.zip"
          Copy-Item "bin/toru-amd64-installer.exe" $installer
          # The zip holds the same files the installer puts in the install folder.
          $stage = Join-Path $env:RUNNER_TEMP "toru-zip"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "bin/toru.exe"                         "$stage/toru.exe"
          Copy-Item "bin/toru-lan.exe"                     "$stage/toru-lan.exe"
          Copy-Item "build/windows/wintun/wintun.dll"      "$stage/wintun.dll"
          Copy-Item "build/windows/wintun/LICENSE.txt"     "$stage/wintun-LICENSE.txt"
          Copy-Item "THIRD_PARTY_NOTICES"                  "$stage/THIRD_PARTY_NOTICES.txt"
          Compress-Archive -Path "$stage/*" -DestinationPath $zip -Force
          # Release assets first, then the LAN files inside the installer and
          # zip (by their installed names), so they can be checked once
          # installed. The updater only looks up the installer's line.
          $sums = [ordered]@{
            $installer           = $installer
            $zip                 = $zip
            "toru-lan.exe"       = "$stage/toru-lan.exe"
            "wintun.dll"         = "$stage/wintun.dll"
            "wintun-LICENSE.txt" = "$stage/wintun-LICENSE.txt"
          }
          $lines = foreach ($name in $sums.Keys) {
            "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 $sums[$name]).Hash.ToLower(), $name
          }
          $lines -join "`n" | Out-File -Encoding ascii -NoNewline SHA256SUMS
          Get-Content SHA256SUMS
          "installer=$installer" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "zip=$zip"             | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Toru ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: |
            ${{ steps.assets.outputs.installer }}
            ${{ steps.assets.outputs.zip }}
            SHA256SUMS
